apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-marco-minilm-l12-v2
  namespace: reranker-model
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-marco-minilm-l12-v2
  template:
    metadata:
      labels:
        app: ms-marco-minilm-l12-v2
    spec:
      automountServiceAccountToken: false
      containers:
        - name: tei
          image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.6
          args:
            - "--model-id"
            - "cross-encoder/ms-marco-MiniLM-L12-v2"
            - "--port"
            - "8080"
          env:
            - name: HF_HUB_CACHE
              value: /data/models
            - name: TRANSFORMERS_CACHE
              value: /data/models
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: cache
              mountPath: /data
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: reranker-model-cache
