{{- if and .Values.ui.enabled .Values.ui.ingress.enabled .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: memoryhub-ui
  namespace: {{ .Values.namespaces.ui }}
  labels:
    {{- include "memoryhub.componentLabels" (dict "root" . "component" "memoryhub-ui") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ default .Values.ingress.host .Values.ui.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: memoryhub-ui
                port: { number: {{ .Values.ui.ingress.servicePort }} }
{{- end }}
