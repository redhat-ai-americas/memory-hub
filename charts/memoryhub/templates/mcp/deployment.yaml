{{- if .Values.mcp.enabled }}
{{- $jwksUri := .Values.mcp.authJwksUri -}}
{{- if not $jwksUri -}}
  {{- if .Values.auth.issuer -}}
    {{- $jwksUri = printf "%s/.well-known/jwks.json" (trimSuffix "/" .Values.auth.issuer) -}}
  {{- else -}}
    {{- $jwksUri = printf "http://%s:8081/.well-known/jwks.json" (include "memoryhub.serviceDNS" (dict "name" "auth-server" "namespace" .Values.namespaces.auth "domain" .Values.clusterDomain)) -}}
  {{- end -}}
{{- end -}}
{{- $authEnabled := or .Values.auth.enabled .Values.auth.issuer .Values.mcp.authJwksUri -}}
{{- $authValidateUrl := .Values.mcp.authApiKeyValidateUrl -}}
{{- if and $authEnabled (not $authValidateUrl) -}}
  {{- $authValidateUrl = printf "http://%s:8081/internal/validate-api-key" (include "memoryhub.serviceDNS" (dict "name" "auth-server" "namespace" .Values.namespaces.auth "domain" .Values.clusterDomain)) -}}
{{- end -}}
{{- $embeddingUrl := .Values.mcp.embeddingUrl -}}
{{- if and (not $embeddingUrl) .Values.models.enabled -}}
  {{- $embeddingName := ternary "all-minilm-l6-v2" "granite-embedding" (eq .Values.models.variant "cpu") -}}
  {{- $embeddingUrl = printf "http://%s:80/embed" (include "memoryhub.serviceDNS" (dict "name" $embeddingName "namespace" .Values.namespaces.embeddingModel "domain" .Values.clusterDomain)) -}}
{{- end -}}
{{- $rerankerUrl := .Values.mcp.rerankerUrl -}}
{{- if and (not $rerankerUrl) .Values.models.enabled -}}
  {{- $rerankerName := ternary "ms-marco-minilm-l12-v2" "granite-reranker" (eq .Values.models.variant "cpu") -}}
  {{- $rerankerUrl = printf "http://%s:80" (include "memoryhub.serviceDNS" (dict "name" $rerankerName "namespace" .Values.namespaces.rerankerModel "domain" .Values.clusterDomain)) -}}
{{- end -}}
{{- $valkeyUrl := .Values.mcp.valkeyUrl -}}
{{- if and (not $valkeyUrl) .Values.valkey.enabled -}}
  {{- $valkeyUrl = printf "redis://%s:6379/0" (include "memoryhub.serviceDNS" (dict "name" "memoryhub-valkey" "namespace" .Release.Namespace "domain" .Values.clusterDomain)) -}}
{{- end -}}
{{- $s3Endpoint := .Values.mcp.s3Endpoint -}}
{{- if and (not $s3Endpoint) .Values.minio.enabled -}}
  {{- $s3Endpoint = printf "%s:9000" (include "memoryhub.serviceDNS" (dict "name" "memoryhub-minio" "namespace" .Values.namespaces.storage "domain" .Values.clusterDomain)) -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-hub-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "memoryhub.componentLabels" (dict "root" . "component" "memory-hub-mcp") | nindent 4 }}
spec:
  replicas: {{ .Values.mcp.replicas }}
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/name: memory-hub-mcp
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  template:
    metadata:
      labels:
        {{- include "memoryhub.componentLabels" (dict "root" . "component" "memory-hub-mcp") | nindent 8 }}
      annotations:
        alpha.image.policy.openshift.io/resolve-names: '*'
    spec:
      automountServiceAccountToken: false
      {{- include "memoryhub.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: mcp-server
          image: {{ include "memoryhub.imageRef" .Values.mcp.image | quote }}
          imagePullPolicy: {{ .Values.mcp.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8080, protocol: TCP }
          {{- with .Values.mcp.probes.liveness }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.mcp.probes.readiness }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - { name: MCP_TRANSPORT, value: {{ .Values.mcp.env.MCP_TRANSPORT | quote }} }
            - { name: MCP_HTTP_HOST, value: {{ .Values.mcp.env.MCP_HTTP_HOST | quote }} }
            - { name: MCP_HTTP_PORT, value: {{ .Values.mcp.env.MCP_HTTP_PORT | quote }} }
            - { name: MCP_HTTP_PATH, value: {{ .Values.mcp.env.MCP_HTTP_PATH | quote }} }
            - { name: MCP_LOG_LEVEL, value: {{ .Values.mcp.env.MCP_LOG_LEVEL | quote }} }
            - name: MEMORYHUB_DB_HOST
              value: {{ include "memoryhub.serviceDNS" (dict "name" "memoryhub-pg" "namespace" .Values.namespaces.database "domain" .Values.clusterDomain) | quote }}
            - name: MEMORYHUB_DB_PORT
              valueFrom:
                secretKeyRef: { name: {{ .Values.mcp.secrets.database }}, key: MEMORYHUB_DB_PORT }
            - name: MEMORYHUB_DB_NAME
              valueFrom:
                secretKeyRef: { name: {{ .Values.mcp.secrets.database }}, key: MEMORYHUB_DB_NAME }
            - name: MEMORYHUB_DB_USER
              valueFrom:
                secretKeyRef: { name: {{ .Values.mcp.secrets.database }}, key: MEMORYHUB_DB_USER }
            - name: MEMORYHUB_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.mcp.secrets.database }}, key: MEMORYHUB_DB_PASSWORD }
            - name: MEMORYHUB_USERS_FILE
              value: /config/users.json
            {{- if $authEnabled }}
            - { name: AUTH_JWKS_URI, value: {{ $jwksUri | quote }} }
            - { name: AUTH_ISSUER, value: {{ .Values.auth.issuer | quote }} }
            - { name: AUTH_AUDIENCE, value: {{ .Values.mcp.env.AUTH_AUDIENCE | quote }} }
            - { name: AUTH_API_KEY_VALIDATE_URL, value: {{ $authValidateUrl | quote }} }
            - name: AUTH_INTERNAL_SERVICE_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.mcp.secrets.authInternal }}, key: AUTH_INTERNAL_SERVICE_KEY }
            {{- end }}
            {{- if $valkeyUrl }}
            - { name: MEMORYHUB_VALKEY_URL, value: {{ $valkeyUrl | quote }} }
            {{- end }}
            {{- if $s3Endpoint }}
            - { name: MEMORYHUB_S3_ENDPOINT, value: {{ $s3Endpoint | quote }} }
            - name: MEMORYHUB_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.mcp.secrets.minio }}, key: MINIO_ROOT_USER }
            - name: MEMORYHUB_S3_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.mcp.secrets.minio }}, key: MINIO_ROOT_PASSWORD }
            - { name: MEMORYHUB_S3_BUCKET, value: {{ .Values.mcp.env.MEMORYHUB_S3_BUCKET | quote }} }
            - { name: MEMORYHUB_S3_SECURE, value: {{ .Values.mcp.env.MEMORYHUB_S3_SECURE | quote }} }
            {{- end }}
            {{- if $embeddingUrl }}
            - { name: MEMORYHUB_EMBEDDING_URL, value: {{ $embeddingUrl | quote }} }
            {{- end }}
            {{- if $rerankerUrl }}
            - { name: MEMORYHUB_RERANKER_URL, value: {{ $rerankerUrl | quote }} }
            {{- end }}
            {{- with .Values.mcp.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
          volumeMounts:
            - { name: users-config, mountPath: /config, readOnly: true }
      volumes:
        - name: users-config
          configMap:
            name: {{ .Values.mcp.usersConfigMap }}
{{- end }}
