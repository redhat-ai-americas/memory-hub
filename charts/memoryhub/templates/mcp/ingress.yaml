{{- if and .Values.mcp.enabled .Values.mcp.ingress.enabled .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: memory-hub-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "memoryhub.componentLabels" (dict "root" . "component" "memory-hub-mcp") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ default .Values.ingress.host .Values.mcp.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.mcp.ingress.path | quote }}
            pathType: Prefix
            backend:
              service:
                name: memory-hub-mcp
                port: { number: 8080 }
{{- end }}
