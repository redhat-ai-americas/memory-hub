{{- if .Values.mcp.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: memory-hub-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "memoryhub.componentLabels" (dict "root" . "component" "memory-hub-mcp") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: memory-hub-mcp
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  ports:
    - { name: http, port: 8080, targetPort: http, protocol: TCP }
{{- end }}
