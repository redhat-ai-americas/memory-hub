{{- if and .Values.auth.enabled .Values.openshift.enabled .Values.auth.rbac.enabled .Values.auth.rbac.authDelegator (.Capabilities.APIVersions.Has "route.openshift.io/v1/Route") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: memoryhub-auth-delegator
  labels:
    {{- include "memoryhub.componentLabels" (dict "root" . "component" "auth-server") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: {{ .Values.auth.serviceAccountName }}
    namespace: {{ .Values.namespaces.auth }}
{{- end }}
