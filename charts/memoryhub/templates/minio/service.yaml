{{- if .Values.minio.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: memoryhub-minio
  namespace: {{ .Values.namespaces.storage }}
  labels:
    {{- include "memoryhub.componentLabels" (dict "root" . "component" "memoryhub-minio") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: api
      port: 9000
      targetPort: api
      protocol: TCP
  selector:
    app.kubernetes.io/name: memoryhub-minio
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
{{- end }}
