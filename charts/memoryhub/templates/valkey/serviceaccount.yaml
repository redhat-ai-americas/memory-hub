{{- if .Values.valkey.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.valkey.serviceAccountName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "memoryhub.componentLabels" (dict "root" . "component" "memoryhub-valkey") | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
