{{- if and .Values.valkey.enabled .Values.openshift.enabled .Values.openshift.sccBindings .Values.openshift.scc.valkey (.Capabilities.APIVersions.Has "security.openshift.io/v1") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: memoryhub-valkey-anyuid
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "memoryhub.componentLabels" (dict "root" . "component" "memoryhub-valkey") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: {{ .Values.valkey.serviceAccountName }}
    namespace: {{ .Release.Namespace }}
{{- end }}
