{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.postgresql.serviceAccountName }}
  namespace: {{ .Values.namespaces.database }}
  labels:
    {{- include "memoryhub.componentLabels" (dict "root" . "component" "memoryhub-pg") | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
