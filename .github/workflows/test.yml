name: Tests

on:
  push:
    branches: [ main ]
    tags:
      - 'sdk/v*.*.*'
      - 'mcp/v*.*.*'
      - 'memoryhub-cli/v*.*.*'
      - 'memoryhub-local/v*.*.*'
  pull_request:
    branches: [ main ]

jobs:
  sdk-tests:
    name: SDK Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Check for SDK changes
        if: github.event_name == 'pull_request'
        id: sdk-changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            sdk:
              - 'sdk/**'

      - name: Set up Python ${{ matrix.python-version }}
        if: github.event_name != 'pull_request' || steps.sdk-changes.outputs.sdk == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        if: github.event_name != 'pull_request' || steps.sdk-changes.outputs.sdk == 'true'
        run: |
          python -m pip install --upgrade pip
          cd sdk && pip install -e .[dev]

      - name: Lint with ruff
        if: github.event_name != 'pull_request' || steps.sdk-changes.outputs.sdk == 'true'
        run: cd sdk && ruff check src

      - name: Run tests with pytest
        if: github.event_name != 'pull_request' || steps.sdk-changes.outputs.sdk == 'true'
        run: cd sdk && pytest

  mcp-tests:
    name: MCP Server Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check for MCP changes
        if: github.event_name == 'pull_request'
        id: mcp-changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            mcp:
              - 'memory-hub-mcp/**'

      - name: Set up Python 3.11
        if: github.event_name != 'pull_request' || steps.mcp-changes.outputs.mcp == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: github.event_name != 'pull_request' || steps.mcp-changes.outputs.mcp == 'true'
        run: |
          python -m pip install --upgrade pip
          # The MCP server imports memoryhub_core, and its tests need the root
          # dev extra (pytest-asyncio, fakeredis, pytest-timeout). Installing
          # only memory-hub-mcp/requirements.txt leaves both out, which is why
          # this job used to abort with 20 collection errors.
          pip install -e '.[dev]'
          pip install -r memory-hub-mcp/requirements.txt

      - name: Run tests with pytest
        if: github.event_name != 'pull_request' || steps.mcp-changes.outputs.mcp == 'true'
        # --timeout keeps one hanging test from burning the job's whole budget;
        # signal (not thread) so the timeout fails that test instead of the run.
        run: >
          cd memory-hub-mcp &&
          pytest tests/ -v --ignore=tests/test_mcp_tools.py -k "not integration"
          --timeout=120 --timeout-method=signal

  auth-tests:
    name: Auth Service Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check for auth changes
        if: github.event_name == 'pull_request'
        id: auth-changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            auth:
              - 'memoryhub-auth/**'

      - name: Set up Python 3.11
        if: github.event_name != 'pull_request' || steps.auth-changes.outputs.auth == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: github.event_name != 'pull_request' || steps.auth-changes.outputs.auth == 'true'
        run: |
          python -m pip install --upgrade pip
          cd memoryhub-auth && pip install -e '.[dev]'

      - name: Run tests with pytest
        if: github.event_name != 'pull_request' || steps.auth-changes.outputs.auth == 'true'
        run: cd memoryhub-auth && pytest tests/ -v

  cli-tests:
    name: CLI Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check for CLI changes
        if: github.event_name == 'pull_request'
        id: cli-changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            cli:
              - 'memoryhub-cli/**'

      - name: Set up Python 3.11
        if: github.event_name != 'pull_request' || steps.cli-changes.outputs.cli == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: github.event_name != 'pull_request' || steps.cli-changes.outputs.cli == 'true'
        run: |
          python -m pip install --upgrade pip
          cd sdk && pip install -e .
          cd ../memoryhub-cli && pip install -e .[dev]

      - name: Lint with ruff
        if: github.event_name != 'pull_request' || steps.cli-changes.outputs.cli == 'true'
        run: cd memoryhub-cli && ruff check src

      - name: Run tests with pytest
        if: github.event_name != 'pull_request' || steps.cli-changes.outputs.cli == 'true'
        run: cd memoryhub-cli && pytest

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16
        env:
          POSTGRES_USER: memoryhub
          POSTGRES_PASSWORD: memoryhub-test
          POSTGRES_DB: memoryhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memoryhub -d memoryhub"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: docker.io/valkey/valkey:8.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Check for integration test changes
        if: github.event_name == 'pull_request'
        id: integration-changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            integration:
              - 'src/**'
              - 'tests/integration/**'
              - 'alembic/**'

      - name: Set up Python 3.11
        if: github.event_name != 'pull_request' || steps.integration-changes.outputs.integration == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: github.event_name != 'pull_request' || steps.integration-changes.outputs.integration == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run integration tests
        if: github.event_name != 'pull_request' || steps.integration-changes.outputs.integration == 'true'
        env:
          MEMORYHUB_DB_HOST: localhost
          MEMORYHUB_DB_PORT: "5432"
          MEMORYHUB_DB_USER: memoryhub
          MEMORYHUB_DB_PASSWORD: memoryhub-test
          MEMORYHUB_DB_NAME: memoryhub
          MEMORYHUB_VALKEY_URL: redis://localhost:6379/0
        run: pytest tests/integration/ -v --tb=short

  integration-plugin-plan:
    name: Integration Plugin Test Plan
    runs-on: ubuntu-latest
    outputs:
      # On non-PR events (pushes/tags to main) there is no base to diff
      # against, so the plugin tests always run — same convention as the
      # other path-gated jobs' step conditions.
      changed: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.integration-plugins }}
      packages: ${{ steps.packages.outputs.packages }}

    steps:
      - uses: actions/checkout@v4

      - name: Check for integration plugin changes
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            integration-plugins:
              - 'integrations/**'

      - name: List integration packages
        id: packages
        run: |
          # Matrix over every directory under integrations/ that ships a
          # package.json, so a new host is picked up without editing the
          # workflow. integrations/common is shared source with no manifest;
          # its tests run through both adapters' vitest includes.
          packages=$(find integrations -mindepth 2 -maxdepth 2 -name package.json -printf '%h\n' \
            | sed 's|^integrations/||' | sort | jq -R . | jq -sc .)
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  integration-plugin-tests:
    name: Integration Plugin Tests (${{ matrix.package }})
    needs: integration-plugin-plan
    if: needs.integration-plugin-plan.outputs.changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.integration-plugin-plan.outputs.packages) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        working-directory: integrations/${{ matrix.package }}
        run: npm ci

      # vitest does not typecheck; the adapters publish type declarations,
      # so tsc catches breakage the test runner never sees.
      - name: Type check
        working-directory: integrations/${{ matrix.package }}
        run: npm run typecheck --if-present

      - name: Run tests
        working-directory: integrations/${{ matrix.package }}
        run: npm test

      # tsup bundling is exercised nowhere else in CI — e.g. the .md?raw
      # loader the shared protocol module depends on only runs at build time.
      - name: Build
        working-directory: integrations/${{ matrix.package }}
        run: npm run build --if-present

  status:
    name: Tests Status
    runs-on: ubuntu-latest
    needs: [sdk-tests, mcp-tests, auth-tests, cli-tests, integration-tests, integration-plugin-plan, integration-plugin-tests]
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.sdk-tests.result }}" == "failure" ] || [ "${{ needs.mcp-tests.result }}" == "failure" ] || [ "${{ needs.auth-tests.result }}" == "failure" ] || [ "${{ needs.cli-tests.result }}" == "failure" ] || [ "${{ needs.integration-tests.result }}" == "failure" ]; then
            echo "One or more test jobs failed"
            exit 1
          fi
          # The planner is the source of truth for whether plugin tests
          # should run. If it fails, do not let the aggregate appear green.
          if [ "${{ needs.integration-plugin-plan.result }}" != "success" ]; then
            echo "Integration plugin test planning failed (result: ${{ needs.integration-plugin-plan.result }})"
            exit 1
          fi
          # A path-gated job reports success even when every step was skipped
          # (#603 trap). When the filter says integrations/ changed, the
          # plugin tests must actually have run and passed — anything other
          # than success (failure, cancelled, wrongfully skipped) is red.
          if [ "${{ needs.integration-plugin-plan.outputs.changed }}" == "true" ] && [ "${{ needs.integration-plugin-tests.result }}" != "success" ]; then
            echo "Integration plugin tests did not run and pass (result: ${{ needs.integration-plugin-tests.result }})"
            exit 1
          fi
          echo "All tests passed successfully"
