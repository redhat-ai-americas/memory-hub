name: Helm Chart

on:
  push:
    branches: [main]
    paths:
      - 'charts/memoryhub/**'
      - 'deploy/**'
      - 'memory-hub-mcp/deploy/openshift.yaml'
      - 'memoryhub-auth/openshift.yaml'
      - 'memoryhub-ui/openshift.yaml'
      - 'memoryhub-ui/openshift/oauth-proxy-sa.yaml'
      - 'scripts/deploy-full.sh'
      - 'scripts/check-helm-chart.sh'
      - 'scripts/check_helm_chart_alignment.py'
      - 'docs/ARCHITECTURE.md'
      - 'docs/SYSTEMS.md'
      - 'docs/guides/cluster-install.md'
      - 'README.md'
      - '.github/workflows/helm-chart.yml'
      - 'Makefile'
  pull_request:
    branches: [main]
    paths:
      - 'charts/memoryhub/**'
      - 'deploy/**'
      - 'memory-hub-mcp/deploy/openshift.yaml'
      - 'memoryhub-auth/openshift.yaml'
      - 'memoryhub-ui/openshift.yaml'
      - 'memoryhub-ui/openshift/oauth-proxy-sa.yaml'
      - 'scripts/deploy-full.sh'
      - 'scripts/check-helm-chart.sh'
      - 'scripts/check_helm_chart_alignment.py'
      - 'docs/ARCHITECTURE.md'
      - 'docs/SYSTEMS.md'
      - 'docs/guides/cluster-install.md'
      - 'README.md'
      - '.github/workflows/helm-chart.yml'
      - 'Makefile'
  workflow_dispatch:

jobs:
  helm-chart:
    name: Helm and manifest alignment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm 3
        uses: azure/setup-helm@v5
        with:
          version: v3.18.4

      - name: Set up kubectl and Kustomize
        uses: azure/setup-kubectl@v4
        with:
          version: v1.36.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YAML parser
        run: python -m pip install PyYAML

      - name: Lint, render, and compare deployment paths
        run: bash scripts/check-helm-chart.sh
