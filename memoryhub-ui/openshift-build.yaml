---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: memoryhub-ui
spec:
  runPolicy: Serial
  output:
    to:
      kind: ImageStreamTag
      name: memoryhub-ui:latest
  source:
    type: Binary
    binary: {}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Containerfile
      noCache: true
  triggers: []
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: memoryhub-ui
