apiVersion: v1
kind: Service
metadata:
  name: {{ include "soc-forensics.fullname" . }}
  labels:
    {{- include "soc-forensics.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "soc-forensics.selectorLabels" . | nindent 4 }}
