apiVersion: apps/v1
kind: Deployment
metadata:
  name: soc-frontend
  annotations:
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"soc-frontend:latest"},
        "fieldPath":"spec.template.spec.containers[?(@.name==\"soc-frontend\")].image"},
       {"from":{"kind":"ImageStreamTag","name":"soc-harness:latest"},
        "fieldPath":"spec.template.spec.containers[?(@.name==\"soc-harness\")].image"}]
spec:
  replicas: 1
  selector:
    matchLabels:
      app: soc-frontend
  template:
    metadata:
      labels:
        app: soc-frontend
    spec:
      containers:
        - name: soc-frontend
          image: image-registry.openshift-image-registry.svc:5000/soc-demo/soc-frontend:latest
          ports:
            - containerPort: 8000
          # Optional: require a token on POST /emit (set it, then pass
          # --token to replay.py / the harness)
          # env:
          #   - name: EMIT_TOKEN
          #     valueFrom:
          #       secretKeyRef:
          #         name: soc-frontend-emit
          #         key: token
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
        - name: soc-harness
          image: image-registry.openshift-image-registry.svc:5000/soc-demo/soc-harness:latest
          ports:
            - containerPort: 8001
          env:
            - name: FRONTEND_URL
              value: "http://localhost:8000"
            - name: SOC_FORENSICS_URL
              valueFrom:
                secretKeyRef:
                  name: soc-harness-config
                  key: soc-forensics-url
            - name: MEMORYHUB_URL
              valueFrom:
                secretKeyRef:
                  name: soc-harness-config
                  key: memoryhub-url
            - name: MEMORYHUB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: soc-harness-config
                  key: memoryhub-api-key
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
